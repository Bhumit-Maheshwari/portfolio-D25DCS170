# ==========================================
# Practical 11: Containerization with Docker and Docker Compose
# Orchestrates: frontend (React:5173), backend (Node/Express:5000), mongodb (Mongo:27017)
# ==========================================

services:
  # ----------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # 2. Node.js / Express Backend Service
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task-manager
      - JWT_SECRET=supersecret_jwt_key_practical7_awdf_2026
      - JWT_EXPIRES_IN=1h
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------
  # 3. React / Vite Frontend Service
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ------------------------------------------
# Isolated Bridge Network
# ------------------------------------------
networks:
  app-network:
    driver: bridge

# ------------------------------------------
# Persistent Named Storage Volume for MongoDB
# ------------------------------------------
volumes:
  mongo-data:
    driver: local
